# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ko-KR'
early_access: true

#  250자 이내
tone_instructions: |
  한국어로 간결하고 건설적인 코드 리뷰를 제공합니다.
  리뷰 우선순위는 유지보수성 > 성능 > 보안입니다.
  서버 연동 없이 목데이터로만 동작하는 프론트엔드 전용 프로젝트임을 감안해 리뷰합니다.

reviews:
  profile: 'assertive'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  assess_linked_issues: false
  related_prs: false
  suggested_labels: true
  sequence_diagrams: false
  changed_files_summary: true

  high_level_summary_in_walkthrough: true
  high_level_summary_placeholder: '이 PR의 주요 변경사항을 요약합니다'
  collapse_walkthrough: true
  commit_status: true
  fail_commit_status: false
  related_issues: false
  abort_on_close: true

  # =====================
  # Path Filters
  # =====================
  path_filters:
    # 허용 경로
    - 'app/**'
    - 'shared/**'
    - 'lib/**'
    - 'styles/**'
    - 'public/**'
    - 'docs/**'
    - '.github/**'
    - 'next.config.*'
    - 'postcss.config.*'
    - 'eslint.config.*'
    - 'tsconfig*.json'
    - 'package.json'
    - 'pnpm-workspace.yaml'
    - '.coderabbit.yaml'
    - '.prettierrc'
    - '.prettierignore'
    - 'lint-staged.config.*'
    - '.husky/**'
    - 'README.md'
    - 'AGENTS.md'

    # 제외 경로
    - '!node_modules/**'
    - '!.next/**'
    - '!out/**'
    - '!build/**'
    - '!.pnpm-store/**'
    - '!.husky/_/**'
    - '!coverage/**'
    - '!**/*.snap'
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.jpeg'
    - '!**/*.gif'
    - '!**/*.webp'
    - '!**/*.ico'
    - '!**/*.avif'
    - '!**/*.mp4'
    - '!**/*.webm'
    - '!**/*.mp3'
    - '!pnpm-lock.yaml'

  # =====================
  # Path Instructions
  # =====================
  path_instructions:
    - path: '.coderabbit.yaml'
      instructions: |
        CodeRabbit 설정 파일 리뷰 시:
        - YAML 문법 및 스키마 호환성 확인
        - path_filters / path_instructions 중복 여부 점검
        - docs/conventions 문서와 설정 내용이 어긋나지 않는지 검토

    - path: 'eslint.config.*'
      instructions: |
        ESLint 설정 리뷰 시:
        - docs/conventions/conventions.md에 정의된 규칙(var 금지, button type 명시, map key 등)과 실제 rules가 어긋나지 않는지
        - eslint-config-prettier가 포맷 관련 규칙과 충돌하지 않도록 마지막에 위치하는지
        - no-restricted-imports의 절대 경로(@/) 유도 패턴이 tsconfig의 path alias와 일치하는지

    - path: '.prettierrc'
      instructions: |
        Prettier 설정 리뷰 시:
        - prettier-plugin-tailwindcss가 유지되어 Tailwind 클래스 정렬이 계속 적용되는지
        - eslint.config.mjs의 eslint-config-prettier와 충돌하는 규칙을 새로 추가하지 않았는지

    - path: 'lint-staged.config.*'
      instructions: |
        lint-staged 설정 리뷰 시:
        - .husky/pre-commit에서 실행하는 lint-staged와 대상 glob이 실제 프로젝트 파일 확장자와 맞는지
        - prettier --write 이후 eslint --fix 순서(포맷 먼저, 린트 나중)가 유지되는지

    - path: '.husky/**'
      instructions: |
        Git hook 리뷰 시:
        - pre-commit이 lint-staged만 실행하고, 무거운 typecheck/build를 포함하지 않는지 (해당 검증은 CI에서 담당)
        - CI(.github/workflows/ci.yml)에서 HUSKY=0으로 hook을 건너뛰도록 되어 있는지

    - path: 'app/**'
      instructions: |
        Next.js App Router 리뷰 시 (docs/architecture/project-structure.md 기준):
        - 페이지 폴더((home), resume, marketing, develop, article) 하위에만 쓰이는 코드는 해당 폴더 안(mocks/, components/)에 두고, 다른 페이지에서도 필요해질 때만 shared로 옮겼는지 확인
        - Server / Client 컴포넌트 경계가 최소화되어 있는지
        - window/document 등 브라우저 API 접근의 SSR 안전성 확인
        - loading.tsx / error.tsx / not-found.tsx 활용 여부 점검

    - path: '**/*.tsx'
      instructions: |
        컴포넌트 리뷰 시 (docs/conventions/conventions.md 기준):
        - 컴포넌트(함수형)는 파스칼 케이스, 파일명도 파스칼 케이스인지 (`PageHeader.tsx`)
        - Props 타입은 `컴포넌트명 + Props`로 선언했는지
        - `button` 태그에 `type`을 명시했는지
        - 버튼/헤더 등 공용 컴포넌트는 `children`을 적극 활용하는지
        - 파일에서 단일 요소만 내보낼 때 default export, 2개 이상이면 각각 named export를 쓰는지

    - path: 'shared/components/ui/**'
      instructions: |
        공용 UI 컴포넌트 리뷰 시:
        - 여러 페이지에서 재사용 가능한 수준으로 일반화되어 있는지 (특정 페이지 로직에 결합되지 않았는지)
        - className 조합 시 `lib/utils`의 `cn` 유틸 사용이 일관적인지
        - children/props 확장을 통한 조합 가능성 고려 여부

    - path: 'shared/components/layout/**'
      instructions: |
        레이아웃 컴포넌트(헤더, 푸터 등) 리뷰 시:
        - 특정 페이지 전용 콘텐츠가 섞여 들어가지 않았는지
        - 전역 스타일 토큰(styles/tokens)을 하드코딩 값 대신 사용하는지

    - path: 'shared/hooks/**'
      instructions: |
        커스텀 훅 리뷰 시:
        - `use` 접두사 및 역할이 이름에서 명확히 드러나는지
        - 의존성 배열(exhaustive-deps) 누락 여부
        - 브라우저 전용 API 사용 시 SSR 안전성 확인

    - path: 'shared/utils/**'
      instructions: |
        공통 유틸 함수 리뷰 시 (docs/conventions/conventions.md 기준):
        - 함수명이 역할을 드러내는지 (`get`, `create`, `check` 등), boolean 반환 함수는 `has+명사`인지
        - 여러 페이지에서 중복되는 로직을 공통화한 것인지, 불필요한 조기 추상화는 아닌지
        - early return을 적극 활용했는지

    - path: 'shared/constants/**'
      instructions: |
        공통 상수 리뷰 시:
        - 대문자 스네이크 케이스로 작성했는지 (`API_KEY`)
        - 특정 페이지에서만 쓰는 상수가 잘못 올라온 것은 아닌지

    - path: 'lib/**'
      instructions: |
        외부 라이브러리 연동 코드 리뷰 시:
        - tailwind 클래스 병합(`cn`) 등 유틸이 프로젝트 전역에서 일관되게 쓰이는지
        - 서버/클라이언트 전용 의존성이 잘못 섞이지 않았는지

    - path: 'styles/**'
      instructions: |
        전역 스타일 리뷰 시:
        - 색상/타이포그래피는 `tokens/color.css`, `tokens/typography.css`의 토큰을 사용하는지
        - 컴포넌트 레벨 스타일이 전역 스타일 파일에 잘못 섞여 들어가지 않았는지

    - path: '.github/workflows/**'
      instructions: |
        GitHub Actions 리뷰 시:
        - pnpm 설치 시 `--frozen-lockfile`을 사용하는지, `packageManager` 필드와 버전이 일치하는지
        - 워크플로우가 실제 package.json 스크립트(lint, build 등)와 일치하는지
        - `permissions`가 필요한 범위로 최소화되어 있는지
        - PR 제목 접두사(docs/conventions/git.md 기준)를 다루는 로직이 최신 접두사 목록과 일치하는지

    - path: 'docs/**'
      instructions: |
        문서 리뷰 시:
        - 코드와 문서 내용이 일치하는지 (구조/컨벤션이 바뀌었다면 관련 문서도 함께 갱신됐는지)
        - 실제로 존재하지 않는 폴더/파일을 문서가 가리키고 있지 않은지

  # =====================
  # Auto Review
  # =====================
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'develop'
      - 'main'
    labels:
      - '!wip'
      - '!draft'
      - '!skip-review'
    ignore_usernames:
      - 'dependabot'
      - 'renovate'
    ignore_title_keywords:
      - '[Docs]'
      - '[skip-review]'

  # =====================
  # Pre-merge Checks
  # =====================
  pre_merge_checks:
    title:
      mode: 'warning'
      requirements: |
        PR 제목은 docs/conventions/git.md 형식을 따라요.

        형식:
        [Type] 작업 내용

        Type (Commit 접두사와 동일, 첫 글자만 대문자):
        Init / Feat / Fix / Docs / Design / Refactor / Test / Chore / Deploy

        예시:
        [Feat] 로그인 페이지 구현
        [Fix] 로그인 레이아웃 수정

    description:
      mode: 'warning'
      requirements: |
        PR 본문은 docs/conventions/git.md 템플릿 섹션을 포함해야 해요.

        ## 📍 Task
        ## 📝 Summary
        ## 🚀 Description
        ## ETC

    issue_assessment:
      mode: 'off'

  # =====================
  # Finishing Touches
  # =====================
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  # =====================
  # Tools
  # =====================
  tools:
    eslint:
      enabled: true
    languagetool:
      enabled: true
      level: 'default'
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true

chat:
  art: false
  auto_reply: true

# =====================
# Knowledge Base
# =====================
knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - 'AGENTS.md'
      - 'docs/conventions/conventions.md'
      - 'docs/conventions/git.md'
      - 'docs/architecture/project-structure.md'
