name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Build project
        id: build
        run: pnpm build
        continue-on-error: true

      - name: Evaluate lint and build status
        id: status
        run: |
          lint_result="${{ steps.lint.outcome }}"
          build_result="${{ steps.build.outcome }}"

          lint_message=""
          build_message=""
          overall_result="success"

          if [ "$lint_result" == "success" ]; then
            lint_message="린트 통과 ✅"
          else
            lint_message="린트 실패 ❌"
            overall_result="failed"
          fi

          if [ "$build_result" == "success" ]; then
            build_message="빌드 성공 🌧️"
          else
            build_message="빌드 실패 ❌"
            overall_result="failed"
          fi

          if [ "$overall_result" == "success" ]; then
            message="모든 검사 통과 💫\n- $lint_message\n- $build_message"
          else
            message="일부 검사 실패 ⚠️\n- $lint_message\n- $build_message"
          fi

          echo "result=$overall_result" >> $GITHUB_OUTPUT
          echo "message=$message" >> $GITHUB_OUTPUT

      - name: Add comment to PR with status
        uses: actions/github-script@v7
        with:
          script: |
            const message = `${{ steps.status.outputs.message }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 빌드 및 린트 결과\n${message}`
            });

      - name: Fail job if any step failed
        if: ${{ steps.status.outputs.result == 'failed' }}
        run: exit 1
