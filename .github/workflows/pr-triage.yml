name: PR Triage

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Assign author
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              assignees: [author],
            });

      - name: Label by title prefix
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const prefixMap = {
              "[Init]": "🔧 Init",
              "[Feat]": "✨Feature",
              "[Fix]": "🐞 Fix",
              "[Docs]": "🔖 Docs",
              "[Design]": "🎨 Design",
              "[Refactor]": "⚒️ Refactor",
              "[Test]": "🤖 Test",
              "[Chore]": "🔨 Chore",
              "[Deploy]": "🌐 Deploy",
            };

            // edited 이벤트는 본문 수정만으로도 트리거되므로 제목 변경 여부를 확인
            if (context.payload.action === "edited" && !context.payload.changes?.title) return;

            const allPrefixLabels = [...new Set(Object.values(prefixMap))];
            const match = Object.entries(prefixMap).find(([prefix]) => title.startsWith(prefix));

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            for (const label of currentLabels) {
              if (allPrefixLabels.includes(label.name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  name: label.name,
                });
              }
            }

            if (!match) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [match[1]],
            });
